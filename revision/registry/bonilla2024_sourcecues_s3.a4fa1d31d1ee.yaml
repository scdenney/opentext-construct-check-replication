# NOT read: no open copy exists (OpenAlex: closed; publisher page and supplement
# require a login). Theory comes from the abstract, the replication code
# (Figures.R; the Study 3/4 cleanup commands as echoed in log.log) and the
# authors' coding instructions. Steven: check the hypotheses section and
# Appendix A-K before registering. Written
