  contamination: "No value of Written_Response was seen. The builder's re-read check revealed (by count, not by display) that one answer, in an excluded row, is the literal string 'NA'; it was dropped as empty. The article body was read by the lead, not by the drafting agent; the passages quoted above are as supplied by the lead."
