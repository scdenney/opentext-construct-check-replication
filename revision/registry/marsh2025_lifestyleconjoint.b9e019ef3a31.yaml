  level: "task-level attribute (fully randomized levels; about 11% of tasks have no stance on either side)"
  notes: "Attributes: party (Democrat/Republican/Independent), pipeline stance (3), hobby (NASCAR fan / organic food markets / plays the fiddle / plays the violin), car (Ford/Subaru), chain (Chick-fil-a/Starbucks). Split folds by respondent, not task; cluster by respondent."
