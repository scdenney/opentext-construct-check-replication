  contamination: "none known; no open-text value was read by the drafter or, per the manifest, the searcher. The study summary's 'Summary of Results: null effects' was read (no outcome specified)"
  author: "draft by Claude agent (wave 3) 2026-11-17 from proposal and questionnaire only"
  date: "2026-11-17"
