# DRAFT, not registered. Written from the IO article (hypotheses, research design, mediation
# results), the variable labels and the replication code before any open-text value was read.
# Mirror image of card lupu2024_lawsofwar: same respondents (ids match), second open item.
id: lupu2024_lawsofwar_gov
title: "Government compliance vs violation of the laws of war and written explanations of approval of the government (France, UK, US 2019)"
source:
  citation: "Lupu, Y., & Wallace, G. P. R. (2024). The laws of war and public support for foreign combatants. International Organization, 78(4), 823-852."
  doi: "10.1017/S0020818324000274"
  data: "doi:10.7910/DVN/WYYEWK (CC0 1.0); data/external/lupu2024_lawsofwar/raw/{France,UK,USA}.dta; harmonized_lupu2024_lawsofwar_gov.csv"
languages: [fr, en]
context: "Adults in France, the United Kingdom and the United States read about a civil war abroad in which the government and the rebels were each described as either following or violating the international laws that limit how combatants may fight, rated their approval of each side, and explained their approval of the government in their own words."
unit: respondent
id_column: ResponseID
text:
  column: app_gov_open
  prompt: "Government approval (open-ended): explanation following the government approval rating (variable label 'Govt Approval (Open-ended)'; exact wording in the online supplement, not read; French-language instrument in France)"
  position: "After the vignette and the 5-point government approval item (app_gov5); government and rebel blocks in randomized order (actor_order); merged column of the order-specific copies App_Gov_Open_RG/GR"
treatment:
  variable: govlaw
  contrast: "government violating international laws of war (Violate = 1) vs following them (Comply = 0)"
  level: respondent
  notes: "2 x 2 x 2 x 2 factorial, respondent level: govlaw, reblaw (rebel compliance), govtype (democracy/autocracy), rebaims (overthrow/secession), plus actor_order. The vignette wording differs by one word ('following' vs 'violating') and the text item asks about the government whose conduct was just described, so a rise in mentions of the government's violations is partly mechanical (positive control). Samples: US 2,009 (March 2019), UK 2,198 (April 2019), France 2,051 (August 2019). Pool with country strata or run per country."
constructs:
  target:
    - name: government_law_violation
      definition: "The response gives the government's violation of international or humanitarian law, war crimes, or abuse of civilians or prisoners as a reason for the rating"
      source: "H1 (section 'International Humanitarian Law, (Non)compliance, and Public Opinion'): information about compliance by foreign combatants increases approval of those combatants; the replication code tests app_gov5 on govlaw; the mediation analysis reports reputation and morality as mediators 'with respect to both actors'"
      expected_direction: increase
  placebo:
    - name: rebel_aims_reference
      definition: "The response refers to what the rebels want: secession or independence of a region, or overthrowing the government"
      rationale: "Rebel aims are randomized independently of government compliance (rebaims), so mentions of aims should not move with govlaw"
    - name: government_regime_reference
      definition: "The response refers to whether the government is democratic or authoritarian"
      rationale: "Regime type (govtype) is randomized independently of government compliance; same placebo as in card lupu2024_lawsofwar"
estimand: "ITT difference (Violate minus Comply) in the share of responses expressing government_law_violation, E[g(R(1))] - E[g(R(0))], estimated on the estimation fold, pooled across countries with country strata"
outcomes:
  closed_ended: "app_gov5 government approval (in the harmonized file); rep_gov5 reputation; moral_gov; legit_gov5; support for economic and military intervention"
human_codes:
  available: false
  column: null
  notes: "The article does not analyse the open-ended responses"
provenance:
  written_before_reading_text: true
  contamination: "None known: no app_gov_open value was printed; counts only (non-empty per arm and country, UTF-8 validity, double-encoding markers). The builder's re-read check showed that 3 answers equal the literal string 'NA' (inferred from a count, no other content seen). The rebel-side card from the same respondents (lupu2024_lawsofwar) has been through pilot and A1/A2 runs, so classifier output on the rebel item exists; I did not open it"
  author: "draft by Claude agent (wave 3) 2026-11-17 from paper, variable labels and replication code only"
  date: "2026-11-17"
