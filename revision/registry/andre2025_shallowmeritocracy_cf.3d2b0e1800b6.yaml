# DRAFT, not registered. Written from the SAFE WP 405 version of the paper (October
# 2023; Sections 2 and 5.3, Appendix C.5), the January 2021 pre-registration of the
# counterfactual experiments (AEARCTR-0005811), counterfactual_study.qsf and the
# author's cleaning code. NOT blind: see provenance.contamination.
id: andre2025_shallowmeritocracy_cf
title: "Information on what the disadvantaged worker would have done at the high rate and spectators' explanations of how they split pay (Andre 2025, counterfactual study)"
source:
  citation: "Andre, P. (2025). Shallow meritocracy. Review of Economic Studies, 92(2), 772-807."
  doi: "10.1093/restud/rdae040"
  data: "doi:10.5281/zenodo.10591832 (licence: Zenodo field 'cc-by-4.0'; package README 'Creative Commons Attribution-NonCommercial 4.0 International (CC BY-NC 4.0)'); data/external/andre2025_shallowmeritocracy/raw/data/fairness_counterfactual.sav and explanations.csv; harmonized_andre2025_shallowmeritocracy_cf.csv"
languages: [en]
context: "US adults in an online survey (Lucid, January 2021) read about two crowd workers who knew before working that worker A would earn $0.50 per task and worker B $0.10, and split the workers' total earnings between them in eight effort scenarios, with real payouts. Afterwards they described the reasoning behind their decisions."
unit: respondent
id_column: ResponseId
text:
  column: "explanation (fairness_counterfactual.sav); `text` in the harmonized file"
  prompt: "You split money between two workers. What was the reasoning that shaped your decisions? Please describe briefly."
  position: "After the eight allocation decisions, near the end of the survey; same wording in every arm."
treatment:
  variable: treatment
  contrast: "Primary: 'high' (spectators learn that worker B would have completed as many tasks as worker A at $0.50) vs 'low' (worker B would not have completed more tasks at $0.50). Second directional contrast: 'high' vs 'none' (no information on worker B's counterfactual). Secondary, no expected direction: 'low' vs 'none'."
  level: respondent
  notes: "Qualtrics BlockRandomizer with even presentation over three cells (treatment = UU / CL / CH). Workers committed in advance to how many tasks they would do at each rate, so the counterfactual is real; in scenarios 1-3 it is 0/10/30% (low) or 50% (high) of all tasks, in scenarios 4-7 it is random in both informed arms. 'High' and 'low' respondents both read the counterfactual information, so a mention of it per se is mechanical in both; the target is directional (worker B would have worked more) and the information says the opposite in 'low'. Against 'none', a rise is partly mechanical (only informed arms read the information): read high vs none as a positive control. The item wording is the same in every arm."
constructs:
  target:
    - name: disadvantage_shaped_effort
      definition: "The response says that worker B's lower effort was caused by his lower piece rate, or that worker B would have done more tasks (or as many as worker A) if he had been paid the higher rate, and treats this as a reason for the split (for example a reason to give B more or to split equally). A statement that B would not have worked more at the higher rate does not count."
      source: "Pre-registration of 13 January 2021, section 3: 'if a higher counterfactual effort choice and hence a stronger choice effect of circumstances matters for spectators' redistributive behavior, one would expect more redistribution towards the disadvantaged worker in condition Counterfactual high than Counterfactual low', and more in high than baseline if 'the complexity of counterfactual reasoning prevented participants from compensating'. Section 2 defines the reasoning of comparable choice meritocrats: ask 'how hard the disadvantaged worker would work if his returns to effort would also be high' and 'base their reward on this counterfactual'; Section 5.3 tests whether removing uncertainty about the counterfactual lets them apply it. Expected increase for high vs low and high vs none. The author does not state a text expectation; the target is the reasoning the stated mechanism describes."
      expected_direction: increase
  placebo:
    - name: workers_need
      definition: "The response says that the workers need the money, for example to live, pay bills, or survive, or refers to their financial hardship."
      rationale: "The counterfactual information concerns worker B's effort at the other rate, not either worker's needs. The author codes need as a separate motive (Table B.5)."
    - name: work_quality
      definition: "The response refers to the quality or accuracy of the workers' tasks (whether the work was done correctly or well), as distinct from the number of tasks."
      rationale: "No arm gives information on the quality of the work."
estimand: "ITT difference (high minus low) in the share of responses expressing disadvantage_shaped_effort, E[g(R(1))] - E[g(R(0))], estimated on the estimation fold; high minus none as a second directional contrast; low minus none as a secondary quantity with no expected sign."
outcomes:
  closed_ended: "Share of total earnings assigned to worker B in scenarios 1-3 (not carried in the harmonized file). The paper reports a 9.7 pp higher share in high than in low (Section 5.3, Figure 3)."
human_codes:
  available: true
  column: "human_effort, human_accept, human_equality, human_endogeneity, human_counterfactual, human_need, human_misunderstand, human_other"
  notes: "Author's multi-label hand codes (explanations.csv), all three arms coded. human_counterfactual (reference to the counterfactual) and human_endogeneity are closest to the target; neither is directional, so 'low' answers saying B would not have worked more may carry human_counterfactual. Coders were probably not blind: the coding file holds `treatment` next to the text, and the paper does not describe the procedure. The paper does not report these codes for this study."
provenance:
  written_before_reading_text: false
  contamination: "(1) The drafter read the paper, which reports the allocation effects of this study (Figure 3) but no text results for it. (2) The paper prints example main-study answers (Table B.5) and four example rationales from the unrandomized rationale study (Table 4), which describes the same high-counterfactual scenario; the drafter read them. (3) The wave-3 searcher printed about 5 rationale-study answers (not this sample). No answer from fairness_counterfactual.sav was printed; no human-code share was computed for this study."
  author: "draft by Claude agent (wave 3) 2026-11-17 from paper, pre-analysis plans, questionnaire and code"
  date: "2026-11-17"
