# DRAFT, not registered. Written from the REStud manuscript (Jan 2026, Section 5.2.2),
# the Qualtrics .qsf files, the authors' cleaning and analysis do-files and variable
# names, before any open-text value was read. The paper's Table 5 (coded narrative
# shares by arm) was read; see provenance.contamination.
id: andre2025_macronarratives_mp
title: "Monetary-policy vs energy-crisis narrative provision and households' own inflation narratives one day later"
source:
  citation: "Andre, P., Haaland, I., Roth, C., Wiederholt, M., & Wohlfart, J. (2026). Narratives about the macroeconomy. Review of Economic Studies."
  doi: "REStud manuscript MS32326 (DOI to confirm); replication package 10.5281/zenodo.15311300"
  data: "10.5281/zenodo.15311300; data/external/andre2025_macronarratives/raw/mp_dag_wave1.dta (assignment), mp_dag_wave2.dta (text); harmonized_andre2025_macronarratives_mp.csv"
languages: [en]
context: "US adults on Prolific in June 2022 took part in a two-part study on inflation and first read an explanation of the rise in inflation attributed to economic experts. One day later, in a follow-up survey, they were told the current US inflation rate and asked which factors they think caused the increase."
unit: respondent
id_column: "responseid (wave 2); id = mp_<responseid>"
text:
  column: story
  prompt: "Why has the inflation rate increased? In previous years, the US inflation rate has mostly varied between 1.5% and 2.5%. At this rate, a bundle of goods and services that costs $1,000 in one year, would cost between $1,015 and $1,025 in the next year. Recently, however, the inflation rate has increased. It is now at [current]%. At this rate, a bundle of goods and services that costs $1,000 in one year, would cost $[price] in the next year. Which factors do you think caused the increase in the inflation rate? Please respond in full sentences."
  position: "Follow-up survey (wave 2), one day after the treatment; same wording in both arms; before the 12-month inflation forecast and the purpose question"
treatment:
  variable: treatment
  contrast: "monetary-policy narrative (mp = 1) vs energy-crisis narrative (energy = 0, active control)"
  level: respondent
  notes: "Qualtrics randomizer in wave 1; text from the follow-up wave, linked by hashed prolific_pid (merge_dag_mp.do). The mp arm read that very low Federal Reserve interest rates injected money into the economy, made credit cheap and saving unattractive, and raised demand beyond supply; the energy arm read the energy-crisis explanation used in the April experiment. Each arm then wrote in its own words how its factor caused inflation (arm-specific items q58 / q46, not used here). The outcome repeats information given the day before, so a rise in the named factor is partly a recall or restatement effect (positive control). No differential attrition (p = 0.321, Section 5.2.2)."
constructs:
  target:
    - name: monetary_policy_cause
      definition: "The response names monetary policy as a cause: the Federal Reserve or central bank, low or near-zero interest rates, cheap credit or borrowing, printing money, or an expansion of the money supply."
      source: "Section 5.2.2 (Design; Results): the monetary policy treatment 'emphasizes the role of monetary policy in driving the inflation increase'; the authors test that 'the treatments successfully shape people's narratives' with dagcode_monpol (analysis/table5.do). Primary target; expected increase."
      expected_direction: increase
    - name: energy_crisis_cause
      definition: "The response names energy as a cause: higher oil, gas, gasoline, fuel or electricity prices, an energy shortage or crisis, or reduced energy supply (including from Russia), raising costs or prices."
      source: "Section 5.2.2: the active control arm receives the energy-crisis narrative, so energy mentions should be higher in the control arm; dagcode_energy in analysis/table5.do. Expected decrease (mp minus energy); secondary."
      expected_direction: decrease
  # The mp narrative mentions demand, cheap credit, saving, big purchases and investment;
  # the energy narrative mentions supply chains, Russia, regulation, firms' cost
  # pass-through. Neither mentions workers, wages, greed or politicians (checked in
  # dag_provision_mp.qsf, blocks Q51 and Q56).
  placebo:
    - name: labor_shortage_cause
      definition: "The response names a shortage of workers, people not returning to work, or rising wages or labor costs as a cause"
      rationale: "Neither provided narrative mentions labor or wages; coded as a separate factor by the authors (labshort)."
    - name: corporate_greed_cause
      definition: "The response blames corporate greed, price gouging, or firms raising prices to increase profits beyond their costs. Firms passing on higher costs does not count."
      rationale: "Neither narrative attributes inflation to profits or greed; the authors code price gouging as a separate factor (profits). Cost pass-through is excluded from the definition because the energy narrative mentions it."
estimand: "ITT difference (mp minus energy) in the share of follow-up responses expressing monetary_policy_cause, E[g(R(1))] - E[g(R(0))], estimated on the estimation fold"
outcomes:
  closed_ended: "inflation_12_w2 (12-month inflation point forecast in the follow-up, 0-20 censored); purpose_correct (hand-coded correct guess of the study hypothesis)"
human_codes:
  available: true
  column: "human_dagcode_* (monpol, energy, labshort, profits, ...), human_dagcat_{demand,supply,misc}, human_dag_both_DS, human_dag_size, human_dag_exists, human_auxcode_{dk,junk}"
  notes: "Authors' DAG hand codes from processed/narratives.dta (clean_narratives.R), merged by wave-2 ResponseId; 736 of 738 wave-2 answers coded. human_dagcode_monpol and human_dagcode_energy are the Table 5 outcomes; human_dagcode_labshort and human_dagcode_profits match the placebos."
provenance:
  written_before_reading_text: true
  contamination: "No answer from this item was seen by me or (per the MANIFEST) by the searcher. Before drafting I read Table 5 and the Section 5.2.2 results (coded monetary-policy and energy shares by arm). The authors' hand codes cover the full sample."
  author: "draft by Claude agent (wave 3) 2026-11-17 from paper, questionnaire and code only"
  date: "2026-11-17"
