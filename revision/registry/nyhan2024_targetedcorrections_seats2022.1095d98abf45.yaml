# DRAFT, not registered. Written from the Study 1 paper (Carey, Fogarty, Gehrke, Nyhan &
# Reifler, Science Advances 2025; Dartmouth working-paper version with Online Appendix A),
# the OSF preregistration gpy3s (Wave 1 section), the Political Behavior paper whose archive
# holds the data, and the Stata variable labels, before any open-text value was read.
# Companion card: nyhan2024_targetedcorrections_seats2020 (same respondents, same randomization).
id: nyhan2024_targetedcorrections_seats2022
title: "Prebunking vs placebo articles and explanations of expected fraud in the 2022 U.S. House and Senate elections (YouGov, October-November 2022)"
source:
  citation: "Carey, J., Fogarty, B., Gehrke, M., Nyhan, B., & Reifler, J. (2025). Prebunking and credible source corrections increase election credibility: Evidence from the U.S. and Brazil. Science Advances (Study 1). Data deposited with Carey, J. M., Chun, E., Cook, A., Fogarty, B. J., Jacoby, L., Nyhan, B., Reifler, J., & Sweeney, L. (2025). The narrow reach of targeted corrections: No impact on broader beliefs about election integrity. Political Behavior, 47(2), 737-750."
  doi: "Science Advances article adv3758 (DOI to confirm); data paper 10.1007/s11109-024-09968-0"
  data: "doi:10.7910/DVN/NCZKCH (CC0); data/external/nyhan2024_targetedcorrections/raw/DART0053_OUTPUT_updated.dta; harmonized_nyhan2024_targetedcorrections_seats2022.csv"
languages: [en]
context: "U.S. adults in a YouGov panel, surveyed shortly before the November 2022 midterm elections, read a short series of news-style articles. Respondents who then said they expected voter fraud to change the result of one or more of the 2022 U.S. House and Senate elections were asked to explain why they expect this."
unit: respondent
id_column: caseid
text:
  column: Q42d_w3
  prompt: "You said you expect that the results of [one or two / three to nine / ten or more] elections for the U.S. House and Senate in 2022 will be changed by voter fraud. Please explain why you expect this to be true. (Online Appendix A, Study 1 questionnaire)"
  position: "Post-treatment, immediately after the closed item Q42c_w3 ('In how many of these elections do you think the winning candidate will not be the rightful winner but instead will win due to voter fraud?' None / One or two / Three to nine / Ten or more). Asked only of respondents who did not answer 'None'. The same closed item was asked before treatment (Q22b_w3) without an explanation."
treatment:
  variable: condition_treat
  contrast: "prebunking articles (condition_treat = 1, harmonized 'prebunking') vs placebo articles (condition_treat = 3, harmonized 'placebo')"
  level: respondent
  notes: "Simple random assignment with p = 1/3 to prebunking, credible sources correction (condition_treat = 2, harmonized 'credible'), or placebo, administered by YouGov (OSF gpy3s, Wave 1). Prebunking: an introductory article 'Beware of False Rumors You May Hear about the 2022 Election' (with an inoculation forewarning) and four articles describing how election procedures protect against fraud, each followed by a comprehension check repeated up to three times. Placebo: articles on unrelated topics (hiking, hearing aids, sleep aids, e-commerce). SELECTION: the explanation is asked only if Q42c_w3 is not 'None', and Q42c_w3 is itself a preregistered outcome of the treatment (H2), so the answering sample is selected after treatment; the estimate conditions on a post-treatment variable and is not an ITT effect on all randomized respondents. Harmonized design columns: closed_post (Q42c_w3, 2-4), closed_pre (pre-treatment version Q22b_w3, 1-4), pid7, weight; the ITT version needs the non-askers from the raw file (closed item = None). Mechanical overlap: the target names the subject matter of the prebunking articles, so part of any shift may be recall of the stimulus (positive control). Same respondents as nyhan2024_targetedcorrections_seats2020."
constructs:
  target:
    - name: election_safeguards
      definition: "The response refers to how elections are run or protected against fraud: procedures or safeguards such as voter-registration list maintenance, voter verification, testing or certification of voting machines, paper ballots, audits, recounts, ballot tracking, or election officials and poll workers checking the process. It counts whether the respondent says these safeguards work or fail."
      source: "Carey et al. (2025), Study 1 design section: the prebunking correction 'seeks to counter those myths by describing the institutional mechanisms and protections used in the U.S. to ensure the integrity of the election process'; Study 3 conclusion that 'the novel substantive content of the prebunking treatment, rather than the warning itself, is responsible for the observed effects'; H2 (prebunking will reduce beliefs in the prevalence and effects of fraud in the 2022 election). The authors state the mechanism but not an expectation about the open-ended answers, which they do not analyze."
      expected_direction: increase
  placebo:
    - name: partisan_blame
      definition: "The response names a political party, partisan group, or specific politician as responsible for fraud or cheating"
      rationale: "The prebunking articles describe nonpartisan election procedures and do not discuss which side commits fraud; partisan attributions are a separate consideration the treatment does not supply"
    - name: personal_experience
      definition: "The response cites the respondent's own experience, or that of family, friends or acquaintances, with voting or elections"
      rationale: "Neither arm provides or asks about personal experience; the prebunking content is general information about procedures"
estimand: "Difference (prebunking minus placebo) in the share of explanations expressing election_safeguards among respondents asked the explanation, E[g(R) | asked, prebunking] - E[g(R) | asked, placebo], estimated on the estimation fold; secondary ITT version with non-askers counted as not expressing the target"
outcomes:
  closed_ended: "Q42c_w3 seats expected to change by fraud in 2022 (1 None ... 4 Ten or more; H2 outcome); confidence in the 2022 vote count (Q42b items)"
human_codes:
  available: false
  column: null
  notes: "Neither paper analyzes the open-ended answers (checked in both texts)"
provenance:
  written_before_reading_text: true
  contamination: "none known; no open-text value was seen by the drafter, and the manifest states the searcher read none. Neither paper prints example answers."
  author: "draft by Claude agent (wave 3, stage 2) 2026-11-17 from papers, preregistration and variable labels only"
  date: "2026-11-17"
