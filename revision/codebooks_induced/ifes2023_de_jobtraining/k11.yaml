codebook:
  name: ifes2023_de_jobtraining_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (Job-training priority
    conjoint with a task-5 open-end, Germany (IFES 2023)). Respondents answered: "Warum
    haben Sie diese*n Kandidat*in ausgewählt? (Why did you choose this candidate?)".
    Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:ifes2023_de_jobtraining:1011
codes:
  east_origin_reasoning:
    definition: Reasoning that explicitly invokes the candidate's place of birth,
      regional origin (specifically East Germany, Saxony, or the former GDR), or national
      origin (Germany) as a primary ground for selection or rejection.
    clarification: Includes mentions of "Sachsen", "Ostdeutschland", "GDR", "Herkunft
      Deutschland", "Deutscher", or specific cities in East/West Germany used as a
      distinguishing factor for prioritization or exclusion.
    negative_clarification: Exclude general mentions of "German" if not tied to a
      specific regional contrast or origin preference in the context of the experiment's
      variables. Exclude general "nationality" if not linked to the specific East/West
      or regional construct. Use `general_nationality_reasoning` if applicable, but
      here `east_origin_reasoning` captures the specific regional/national origin
      construct. If the mention is purely incidental (e.g., "lives in Hamburg" without
      origin preference), use `none_of_above`.
  criminal_record_reasoning:
    definition: Reasoning based on the presence or absence of a criminal record (Vorstrafe),
      including specific types of crimes like theft or tax evasion.
    clarification: Includes mentions of "keine Vorstrafe", "Vorstrafe", "Diebstahl",
      "Steuerhinterziehung", "nicht vorbestraft", "kriminell", or "Straftat".
    negative_clarification: Exclude general moral judgments not linked to a specific
      legal record. Exclude mentions of criminal records only if they are part of
      a broader "fit" argument without specific focus on the record itself.
  age_reasoning:
    definition: Reasoning based on the candidate's age, including youth, old age,
      proximity to retirement, or life stage.
    clarification: Includes "jung", "älter", "Alter", "Rentenalter", "lernfähig",
      "Erfahrung" (when linked to age), "noch lange arbeiten", "bald Rente".
    negative_clarification: Exclude age mentions if they are part of a general "fit"
      or "sympathy" argument without explicit age-based logic. Use `general_fit_reasoning`
      if age is just one of many vague factors.
  family_status_reasoning:
    definition: Reasoning based on the candidate's family situation, including number
      of children, marital status, or being single/parent.
    clarification: Includes "Kinder", "ledig", "verheiratet", "Alleinerziehend", "Familie",
      "Mann", "Frau" (when linked to family role).
    negative_clarification: Exclude mentions of family if they are not the primary
      reason for selection (e.g., "sympathetic because she is a mother" might be `general_sympathy`
      or `family_status` depending on explicitness; if explicit need for support due
      to children, use this).
  general_fit_sympathy:
    definition: General subjective feelings of fit, sympathy, trust, or intuition
      without specific attribute-based reasoning.
    clarification: Includes "passt besser", "sympathisch", "Bauchgefühl", "Vertrauen",
      "Gefällt mir", "spricht mich an", "eher so", "einfach besser".
    negative_clarification: Exclude if a specific attribute (age, crime, origin) is
      clearly stated. Exclude if the response is "I had to choose" or "random".
  employment_qualification_reasoning:
    definition: Reasoning based on current employment status, job level, qualification,
      or career potential.
    clarification: Includes "Job", "Beschäftigung", "Qualifikation", "Filialleiter",
      "Vollzeit", "Teilzeit", "Karriere", "Einkommen", "Weiterbildung".
    negative_clarification: Exclude if the employment status is mentioned only as
      a fact without being the reason for choice (e.g., "he has a job" vs "I chose
      him because he has a better job").
  none_of_above:
    definition: Uninformative, random, or non-substantive responses.
    clarification: Includes "weiß nicht", "keine Ahnung", "passt einfach", "einer
      muss es ja sein", "zufall", "ok", "gut", "besser", "???", gibberish, or responses
      that do not provide a clear reason related to the candidate's attributes.
    negative_clarification: Exclude any response that provides a discernible reason,
      even if vague, that can be mapped to other codes.

