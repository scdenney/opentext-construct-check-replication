codebook:
  name: ifes2023_de_jobtraining_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (Job-training priority
    conjoint with a task-5 open-end, Germany (IFES 2023)). Respondents answered: "Warum
    haben Sie diese*n Kandidat*in ausgewählt? (Why did you choose this candidate?)".
    Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:ifes2023_de_jobtraining:1006
codes:
  east_origin_reasoning:
    definition: Reasoning that explicitly invokes the candidate's place of birth,
      regional origin (specifically East Germany, Saxony, or the former GDR), or national
      identity (West Germany) as a primary ground for selection or rejection.
    clarification: Includes mentions of "Sachsen", "Osten", "Westen", "Bayern" (when
      contrasted with origin or used as a proxy for regional identity in this specific
      context of origin-based reasoning), "deutsche Herkunft", or explicit references
      to being from the East/West. Also includes negative reasoning based on origin
      (e.g., "weil sie nicht aus dem Osten kommt").
    negative_clarification: Exclude general mentions of "Deutschland" or "Deutsch"
      unless specifically tied to an East/West distinction or origin debate. Exclude
      general professional experience or age unless explicitly linked to regional
      stereotypes. Use `general_demographic_reasoning` for general age/gender mentions
      without regional specificity. Use `none_of_above` for vague or uninformative
      answers.
  criminal_record_reasoning:
    definition: Reasoning based on the candidate's criminal history, specifically
      the presence or absence of prior convictions (Vorstrafen) or specific crimes
      like theft or tax evasion.
    clarification: Includes mentions of "keine Vorstrafen", "vorbestraft", "Diebstahl",
      "Steuerhinterziehung", "Straftaten", or "kriminell". Covers both positive selection
      (no record) and negative selection (has record).
    negative_clarification: Exclude general moral judgments not tied to legal records.
      Exclude reasoning based on job performance or skills. Use `none_of_above` for
      incoherent responses.
  age_reasoning:
    definition: Reasoning based on the candidate's age, typically favoring younger
      candidates for future potential or older candidates for experience, or citing
      retirement proximity.
    clarification: Includes mentions of "jung", "älter", "Alter", "Jahrgang", "Rentenalter",
      "Lebensalter", or comparisons of age between candidates.
    negative_clarification: Exclude age mentions if they are part of a broader demographic
      description without explicit reasoning about its impact on job training priority.
      Use `general_demographic_reasoning` if age is just listed as a fact without
      evaluative reasoning.
  family_status_reasoning:
    definition: Reasoning based on the candidate's family situation, such as having
      children, being single/married, or being a single parent.
    clarification: Includes mentions of "Kinder", "alleinerziehend", "ledig", "verheiratet",
      "Familie", "Versorgung der Kinder", or "Familienstand".
    negative_clarification: Exclude general sympathy for families not tied to specific
      structural disadvantages (like single parenthood) or future earning potential.
      Use `none_of_above` for vague references.
  professional_status_reasoning:
    definition: Reasoning based on the candidate's current employment status, job
      type, income level, or professional experience.
    clarification: Includes mentions of "Teilzeit", "Vollzeit", "Gehalt", "Job", "Berufserfahrung",
      "Filialleiter", "Kaufhaus", "Anstellung", or "Einkommen".
    negative_clarification: Exclude general statements about "good job" without specifics.
      Use `none_of_above` for uninformative answers.
  general_demographic_reasoning:
    definition: Reasoning based on general demographic characteristics like gender
      or general attractiveness/sympathy, without specific reference to origin, crime,
      age, or family structure as a primary driver.
    clarification: Includes mentions of "weiblich", "männlich", "sympathisch", "Bauchgefühl",
      "Gefühl", "passt zu mir", or general preference not explained by the other specific
      codes.
    negative_clarification: Exclude if the reason falls into more specific categories
      like `east_origin_reasoning`, `criminal_record_reasoning`, etc. Use `none_of_above`
      for non-answers.
  none_of_above:
    definition: Residual code for responses that are uninformative, incoherent, express
      no preference, or do not fit into the specific substantive categories.
    clarification: Includes "Weiß nicht", "Keine Ahnung", "Egal", "Keine Präferenz",
      random characters, "Ich musste wählen", "Nichts", or vague statements like "Besser"
      without explanation.
    negative_clarification: Exclude any response that provides a substantive reason,
      even if brief, that fits into other codes.

