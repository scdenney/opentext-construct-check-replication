codebook:
  name: rok2024_q40_election_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (Candidate-choice
    conjoint with a randomized general vs presidential election frame, South Korea
    2024). Respondents answered: "Q40: 해당 후보를 선택하신 이유는 무엇입니까? (Why did you choose
    this candidate?)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:rok2024_q40_election:1008
codes:
  programmatic_policy_reasoning:
    definition: The respondent justifies their choice based on specific policy positions,
      ideological stances, or proposed legislative/administrative changes.
    clarification: Includes references to specific policy areas such as housing/real
      estate taxes, labor hours (e.g., 4.5-day work week), nuclear weapons policy
      (independent development or non-deployment), foreign policy (alliances, balance),
      anti-discrimination laws, and general ideological alignment (progressive/conservative)
      that implies a policy platform.
    negative_clarification: Excludes general statements about "good policies" without
      specifying content, or reasons based on personal integrity, age, or lack of
      scandal. Use `personal_characteristics` or `none_of_above` instead.
  personal_characteristics:
    definition: The respondent justifies their choice based on the candidate's personal
      traits, background, or perceived integrity rather than policy substance.
    clarification: Includes references to honesty, lack of corruption/scandal, age
      (young/old), experience, background (e.g., prosecutor, activist), gender, and
      general trustworthiness or likability.
    negative_clarification: Excludes reasons based on specific policy agreements or
      ideological camps. Use `programmatic_policy_reasoning` instead.
  comparative_preference:
    definition: The respondent chooses the candidate because they are perceived as
      relatively better than the alternative, without citing specific substantive
      reasons.
    clarification: Includes phrases like "less bad," "relatively better," "no other
      choice," "just picked one," or general preference for one over the other without
      detailing why.
    negative_clarification: Excludes specific policy or personal trait justifications.
      Use `programmatic_policy_reasoning` or `personal_characteristics` if a specific
      reason is implied but vague.
  none_of_above:
    definition: The response is uninformative, non-substantive, or indicates no reason
      for the choice.
    clarification: Includes "no reason," "random," gibberish, "I don't know," or responses
      that do not provide a clear justification for the candidate selection.
    negative_clarification: Excludes any response that offers a discernible reason,
      even if weak. Use `comparative_preference` if a relative judgment is made.

