codebook:
  name: rok2024_q40_election_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (Candidate-choice
    conjoint with a randomized general vs presidential election frame, South Korea
    2024). Respondents answered: "Q40: 해당 후보를 선택하신 이유는 무엇입니까? (Why did you choose
    this candidate?)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:rok2024_q40_election:1006
codes:
  programmatic_policy_reasoning:
    definition: The respondent justifies their choice based on specific policy positions,
      ideological stances, or campaign promises (공약) of the candidate. This includes
      labor, housing/real estate tax, social policy (e.g., anti-discrimination law),
      foreign policy (e.g., US-ROK alliance, North Korea relations), and nuclear weapons
      policy.
    clarification: Includes explicit mentions of policy areas (housing, labor, nuclear,
      foreign policy), ideological alignment (conservative, progressive, pro-national
      interest), and specific campaign promises that align with the respondent's views.
    negative_clarification: Do not use for general statements about "good policies"
      without specifying the content, or for personal characteristics. If the reason
      is purely about the candidate's character or lack of scandal, use personal_characteristics.
      If the answer is uninformative, use none_of_above.
  personal_characteristics:
    definition: The respondent justifies their choice based on the candidate's personal
      traits, background, or perceived integrity, rather than their policy platform.
    clarification: Includes age (young/old), appearance, perceived honesty, lack of
      scandal/corruption allegations, professional background (e.g., prosecutor, activist),
      and general likability or trustworthiness.
    negative_clarification: Do not use for policy-specific reasons. If the respondent
      mentions "no scandal" but links it to policy competence, prioritize programmatic_policy_reasoning
      if the policy aspect is dominant, but usually "no scandal" is personal integrity.
      If the reason is "I like them" without specific traits, use none_of_above.
  comparative_superiority:
    definition: The respondent chooses the candidate because they are perceived as
      the "lesser of two evils" or simply better than the alternative, without citing
      specific policy or personal reasons.
    clarification: Includes phrases like "lesser evil," "better than the other," "relatively
      better," or "no other good option."
    negative_clarification: Do not use if the respondent specifies *why* the candidate
      is better (e.g., "better housing policy"). If the reason is purely comparative
      without substantive content, use this code.
  none_of_above:
    definition: The response is uninformative, non-substantive, or indicates no specific
      reason for the choice.
    clarification: Includes "no reason," "just felt like it," "don't know," random
      characters, or vague expressions like "good person" without elaboration.
    negative_clarification: Do not use if the respondent provides a specific policy
      or personal trait reason.

