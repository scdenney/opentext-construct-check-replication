codebook:
  name: rok2024_q40_election_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (Candidate-choice
    conjoint with a randomized general vs presidential election frame, South Korea
    2024). Respondents answered: "Q40: 해당 후보를 선택하신 이유는 무엇입니까? (Why did you choose
    this candidate?)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:rok2024_q40_election:1005
codes:
  programmatic_policy_reasoning:
    definition: Justifies the choice by referencing specific policy positions, ideological
      stances, or political platforms of the candidate.
    clarification: Includes references to housing/real estate taxes, labor issues
      (working hours, employment guarantees), foreign policy (US-ROK alliance, North
      Korea relations, nuclear weapons), anti-discrimination laws, welfare, and general
      ideological alignment (progressive/conservative) or "national interest" (gukik)
      when framed as a policy outcome.
    negative_clarification: Exclude references to personal integrity, age, gender,
      appearance, or lack of scandals. If the response is vague (e.g., "good policies")
      without specifying content, code as none_of_above unless it clearly implies
      alignment with known platforms.
  personal_characteristics:
    definition: Justifies the choice based on the candidate's personal traits, demographics,
      or physical attributes.
    clarification: Includes age (young/old), gender (male/female), appearance, perceived
      honesty, integrity, cleanliness, lack of scandal, experience, competence, or
      personality traits (rational, harmonious, decisive).
    negative_clarification: Exclude references to policy platforms or ideological
      camps. If the reason is "no scandal," code as personal_characteristics (integrity),
      not policy.
  comparative_superiority:
    definition: Justifies the choice by stating the candidate is better than the alternative,
      without specifying why.
    clarification: Includes phrases like "less bad," "better than the other," "only
      choice," "no other option," or general preference ("I like this one more") without
      citing specific policy or personal reasons.
    negative_clarification: Exclude specific reasons. If the respondent says "better
      because of housing policy," code as programmatic_policy_reasoning. If they say
      "better because he is younger," code as personal_characteristics.
  none_of_above:
    definition: Uninformative, empty, or non-substantive responses.
    clarification: Includes empty strings, random characters, "no reason," "don't
      know," "I don't know who I voted for," or generic positive sentiments ("good,"
      "nice") that do not constitute a reason.
    negative_clarification: Exclude any response that provides a discernible reason,
      even if weak. If the response is "I don't know," code as none_of_above.

