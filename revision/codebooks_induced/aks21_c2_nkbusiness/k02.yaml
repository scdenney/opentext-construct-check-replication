codebook:
  name: aks21_c2_nkbusiness_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (NK migrant entrepreneurship
    policy conjoint with a randomized policy rationale, South Korea 2021). Respondents
    answered: "이 정책을 선택하신 이유는 무엇입니까? (Why did you choose the policy you did?)". Read
    each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:aks21_c2_nkbusiness:1002
codes:
  anti_discrimination_help:
    definition: Reasoning that explicitly or implicitly invokes helping North Koreans
      who face discrimination, prejudice, or unequal treatment in South Korea, often
      linking support to overcoming social barriers or ensuring fair treatment.
    clarification: Includes mentions of helping those facing discrimination, prejudice,
      unequal treatment, or social exclusion. Also includes references to human rights
      organizations supporting the policy as a proxy for addressing discrimination
      or rights issues.
    negative_clarification: Exclude general economic support, employment generation,
      or business growth reasons that do not reference discrimination or rights. Use
      'economic_benefit' or 'employment_support' instead.
  economic_benefit:
    definition: Reasoning based on the economic advantages of the policy, such as
      profitability, revenue generation, tax efficiency, or financial sustainability.
    clarification: Includes mentions of profitability, revenue, tax incentives (e.g.,
      corporate tax increases vs. income tax), cost-effectiveness, budget constraints,
      or avoiding government deficit spending.
    negative_clarification: Exclude reasons focused on social justice, discrimination,
      or general employment. Use 'anti_discrimination_help' or 'employment_support'
      instead.
  employment_support:
    definition: Reasoning that prioritizes job creation, hiring, or labor market stability
      as the primary benefit of the policy.
    clarification: Includes explicit mentions of employment support, job creation,
      hiring workers, or labor market benefits.
    negative_clarification: Exclude general business growth or economic profit reasons.
      Use 'economic_benefit' instead.
  political_heuristic:
    definition: Reasoning based on political cues, such as party support, endorsement
      by specific political figures, or partisan alignment, rather than policy content.
    clarification: Includes mentions of support from specific parties (e.g., Democratic
      Party, People Power Party), presidents, or political groups. Also includes rejection
      based on political opposition.
    negative_clarification: Exclude policy-specific reasoning. Use 'none_of_above'
      if the reason is purely emotional or unintelligible.
  policy_mechanism:
    definition: Reasoning based on the specific design or mechanism of the policy,
      such as the type of support (consulting, loans, grants) or target eligibility.
    clarification: Includes preferences for consulting services, low-interest loans,
      incubation, or specific target groups (e.g., joint ventures, profitable businesses
      only).
    negative_clarification: Exclude reasons based on political cues or general economic
      benefits. Use 'political_heuristic' or 'economic_benefit' instead.
  social_integration:
    definition: Reasoning that emphasizes the integration of North Koreans into South
      Korean society through cooperation, joint ventures, or mutual benefit.
    clarification: Includes mentions of joint ventures between North Koreans and South
      Koreans, mutual benefit, social cohesion, or helping North Koreans become self-reliant
      through integration.
    negative_clarification: Exclude reasons focused solely on economic profit or discrimination.
      Use 'economic_benefit' or 'anti_discrimination_help' instead.
  none_of_above:
    definition: Uninformative, vague, or non-substantive responses that do not provide
      a clear reason for the policy choice.
    clarification: Includes responses like "no reason," "just because," "don't know,"
      "both are bad," or unintelligible text.
    negative_clarification: Exclude any response that provides a discernible reason,
      even if brief. Use specific codes for substantive reasons.

