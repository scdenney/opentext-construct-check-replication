codebook:
  name: aks21_c1_neighbor_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (NK defector-migrant
    profile conjoint, neighbor-choice rationale, South Korea 2021). Respondents answered:
    "이 프로필을 선택하신 이유는 무엇입니까? 설명해 주십시오. (Why did you choose the profile you did?)".
    Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:aks21_c1_neighbor:1011
codes:
  social_integration_ties:
    definition: Reasoning that explicitly references the profile's social connections,
      mixing with South Koreans, or ability to fit into the local community network.
    clarification: Includes mentions of having South Korean colleagues, being married
      to a South Korean, having no North Korean-only circles, having many acquaintances
      in Korea, or generally being well-integrated socially.
    negative_clarification: Do not use for general stability, age, or professional
      skills unless they are explicitly linked to social mixing (e.g., "married to
      a Korean" is integration; "has a job" is not). Use 'professional_qualifications'
      or 'demographic_factors' instead if the reason is purely professional or demographic.
  professional_qualifications:
    definition: Reasoning based on the profile's job title, skills, education, or
      work experience.
    clarification: Includes mentions of being a doctor, programmer, office worker,
      having specific computer skills, professional trust, or being able to perform
      tasks well.
    negative_clarification: Do not use for general stability or age. If the job is
      mentioned only as a proxy for stability without specific skill reference, consider
      'stability_factors'. Use 'social_integration_ties' if the job context implies
      social mixing (e.g., "works with Koreans").
  stability_factors:
    definition: Reasoning based on the perceived economic or life stability of the
      profile.
    clarification: Includes mentions of having a stable job, being married (as a stabilizing
      factor), having children (responsibility), being divorced (settled), or general
      economic security.
    negative_clarification: Do not use for specific professional skills (use 'professional_qualifications')
      or social network details (use 'social_integration_ties').
  demographic_factors:
    definition: Reasoning based on age, gender, or physical attributes.
    clarification: Includes mentions of being young, old, male, female, or age-related
      traits like "energetic" or "experienced" derived solely from age.
    negative_clarification: Do not use if age is linked to integration (e.g., "young
      enough to adapt quickly" might be 'adaptation_potential' or 'stability'). Use
      'social_integration_ties' if gender is linked to social roles (e.g., "female,
      so needs protection" is demographic, but "female colleague" is integration).
  adaptation_potential:
    definition: Reasoning based on the profile's ability to adapt to South Korean
      society, often inferred from length of stay.
    clarification: Includes mentions of long residence in Korea, understanding Korean
      culture, quick adaptation, or familiarity with the environment.
    negative_clarification: Do not use for general stability or professional skills.
      If the long stay is cited specifically for having Korean friends/colleagues,
      use 'social_integration_ties'.
  north_korean_affiliation:
    definition: Reasoning based on the profile's political or organizational background
      in North Korea.
    clarification: Includes mentions of not being a Workers' Party member, not being
      a defector from a specific region, or concerns about North Korean influence/ideology.
    negative_clarification: Do not use for general political views unrelated to NK
      affiliation. Use 'none_of_above' if the mention is vague or irrelevant.
  none_of_above:
    definition: Uninformative, random, or non-substantive responses.
    clarification: Includes single words like "just", "good", "no reason", random
      characters, emojis, or responses that do not provide a clear rationale for the
      choice.
    negative_clarification: Do not use for any substantive reason related to the other
      codes.

