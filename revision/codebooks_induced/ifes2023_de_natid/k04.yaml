codebook:
  name: ifes2023_de_natid_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (National-identity
    conjoint with a randomly withheld religion attribute and a task-5 open-end, Germany
    (IFES 2023)). Respondents answered: "Bitte beschreiben Sie, warum die von Ihnen
    gewählte Person eher deutsch ist (Please describe why the person you chose is
    more German)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:ifes2023_de_natid:1004
codes:
  religious_criteria:
    definition: Reasoning that explicitly invokes religion, Christianity, the church,
      or faith as a primary or significant ground for the person being (more) German.
    clarification: Includes mentions of being Christian, having Christian faith, religion
      as a cultural link to Germany, or the church.
    negative_clarification: Exclude mentions of religion only as a neutral fact without
      linking it to German identity, or if religion is mentioned alongside other factors
      but is not the distinguishing reason for the choice. Use 'legal_civic_criteria'
      or 'cultural_identity_criteria' if religion is not the focus.
  legal_civic_criteria:
    definition: Reasoning based on legal status, citizenship, adherence to laws, or
      respect for political institutions and the constitution.
    clarification: Includes German citizenship (Staatsbürgerschaft), obeying laws,
      respect for institutions/political system, constitution, and democratic values.
    negative_clarification: Exclude purely cultural or ethnic arguments. If the response
      mentions religion, use 'religious_criteria'. Use 'none_of_above' for non-substantive
      answers.
  cultural_identity_criteria:
    definition: Reasoning based on language proficiency, self-identification as German,
      familiarity with history/traditions, or cultural integration.
    clarification: Includes speaking German, feeling German (empfindet sich als deutsch),
      knowledge of German history, respect for traditions, and cultural integration.
    negative_clarification: Exclude legal/civic arguments (use 'legal_civic_criteria')
      and ethnic/biological arguments (use 'ethnic_ancestry_criteria').
  ethnic_ancestry_criteria:
    definition: Reasoning based on biological descent, ancestry, or birthplace as
      the primary determinant of German identity.
    clarification: Includes having German ancestors (Vorfahren), being born in Germany
      (Geburtsort), or ethnic roots.
    negative_clarification: Exclude cultural or legal arguments. If the response mixes
      birthplace with legal status, prioritize 'legal_civic_criteria' if citizenship
      is mentioned, or 'cultural_identity_criteria' if integration is emphasized.
  subjective_preference:
    definition: Reasoning based on personal intuition, sympathy, general agreement,
      or arbitrary choice without specific substantive criteria.
    clarification: Includes "gut feels" (Bauchgefühl), "I like this person more,"
      "fits my opinion," "random choice," or vague statements like "better" or "more
      German" without explanation.
    negative_clarification: Exclude responses that provide specific reasons (legal,
      cultural, religious, ethnic). Use 'none_of_above' for gibberish or complete
      non-answers.
  none_of_above:
    definition: Responses that are uninformative, nonsensical, express uncertainty,
      or do not provide a reason for the choice.
    clarification: Includes "I don't know," "no answer," gibberish, random characters,
      "both are equal," "irrelevant," or purely negative statements without justification.
    negative_clarification: Exclude any response that offers a substantive reason
      (even if weak) for why the person is German.

