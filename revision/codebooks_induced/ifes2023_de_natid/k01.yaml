codebook:
  name: ifes2023_de_natid_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (National-identity
    conjoint with a randomly withheld religion attribute and a task-5 open-end, Germany
    (IFES 2023)). Respondents answered: "Bitte beschreiben Sie, warum die von Ihnen
    gewählte Person eher deutsch ist (Please describe why the person you chose is
    more German)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:ifes2023_de_natid:1001
codes:
  religious_criteria:
    definition: Reasoning that explicitly invokes religion, Christianity, the church,
      or religious faith as a primary or significant ground for the person being (more)
      German.
    clarification: Includes mentions of being Christian, having a Christian background,
      religious affiliation, or faith-based values as a marker of German identity.
    negative_clarification: Exclude general moral values, respect for laws, or cultural
      traditions that are not explicitly tied to religious doctrine or practice. Use
      'cultural_tradition' or 'legal_respect' instead if those are the primary reasons.
  legal_institutional_respect:
    definition: Reasoning based on respect for, adherence to, or understanding of
      German laws, political institutions, and the constitutional order.
    clarification: Includes references to respecting the government, following laws,
      accepting the political system, or knowing legal obligations.
    negative_clarification: Exclude general personal sympathy or vague agreement with
      statements. Use 'personal_affinity' if the reason is purely emotional or subjective
      preference without reference to institutions.
  cultural_historical_knowledge:
    definition: Reasoning based on familiarity with German history, traditions, customs,
      or cultural norms.
    clarification: Includes mentions of knowing German history, respecting traditions,
      understanding cultural norms, or being integrated into the cultural fabric.
    negative_clarification: Exclude mere language proficiency or legal compliance.
      Use 'language' or 'legal_institutional_respect' if those are the sole reasons.
  language_proficiency:
    definition: Reasoning that cites the ability to speak, understand, or learn the
      German language as a key indicator of German identity.
    clarification: Includes statements about speaking German, understanding the language,
      or the necessity of language for integration.
    negative_clarification: Exclude general communication or vague "understanding."
      Use 'cultural_historical_knowledge' if the focus is on cultural nuance rather
      than linguistic ability.
  birthplace_residence:
    definition: Reasoning based on the person's place of birth or length of residence
      in Germany.
    clarification: Includes being born in Germany, living in Germany for a long time,
      or growing up in Germany.
    negative_clarification: Exclude citizenship status alone. Use 'citizenship' if
      only legal status is mentioned, or 'birthplace_residence' if both are present
      but residence/birth is the emphasized factor.
  citizenship_descent:
    definition: Reasoning based on legal citizenship status or ethnic ancestry/descent.
    clarification: Includes holding German citizenship (Staatsbürgerschaft), having
      German ancestors (Vorfahren), or "German blood."
    negative_clarification: Exclude birthplace if the focus is strictly on legal status
      or ancestry. Use 'birthplace_residence' if the focus is on where they lived.
  subjective_identification:
    definition: Reasoning based on the person's self-identification as German or the
      respondent's subjective feeling/intuition.
    clarification: Includes the person "feeling" German, "embodying" German traits,
      or the respondent's "gut feeling," "sympathy," or personal opinion that the
      person fits the image of a German.
    negative_clarification: Exclude objective criteria like laws, language, or birth.
      Use 'legal_institutional_respect' or 'language' if objective criteria are cited.
  none_of_above:
    definition: Uninformative, non-substantive, or random responses that do not provide
      a clear reason for the classification.
    clarification: Includes "I don't know," "No reason," random characters, "Just
      had to choose," "Both are equal," or vague statements like "It is what it is"
      without further elaboration.
    negative_clarification: Exclude any response that offers at least one specific
      criterion (even if weak). Use the most appropriate substantive code if a specific
      reason is identifiable.

