codebook:
  name: ifes2023_de_natid_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (National-identity
    conjoint with a randomly withheld religion attribute and a task-5 open-end, Germany
    (IFES 2023)). Respondents answered: "Bitte beschreiben Sie, warum die von Ihnen
    gewählte Person eher deutsch ist (Please describe why the person you chose is
    more German)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:ifes2023_de_natid:1008
codes:
  religious_criteria:
    definition: Reasoning that explicitly invokes religion, Christianity, the church,
      or religious faith as a primary or significant ground for the person being (more)
      German.
    clarification: Includes mentions of being Christian, having a Christian faith,
      belonging to the church, or religious values as a marker of German identity.
    negative_clarification: Exclude general moral values, secular traditions, or cultural
      practices not explicitly tied to religion. Use 'cultural_heritage' or 'legal_respect'
      instead if the reasoning is secular.
  legal_respect:
    definition: Reasoning based on adherence to German laws, respect for political
      institutions, or compliance with the legal and democratic order.
    clarification: Includes references to respecting laws, institutions, the constitution,
      democratic values, or following rules.
    negative_clarification: Exclude general politeness or vague "respect" without
      reference to laws/institutions. Use 'general_impression' if it's just about
      being nice.
  language_proficiency:
    definition: Reasoning that cites the ability to speak German or linguistic competence
      as a key indicator of German identity.
    clarification: Includes mentions of speaking German, understanding the language,
      or language skills as a barrier or bridge to identity.
    negative_clarification: Exclude general communication or non-linguistic traits.
      Use 'cultural_heritage' if language is mentioned alongside deep cultural history.
  birthplace_residence:
    definition: Reasoning based on being born in Germany, having lived in Germany
      for a significant time, or having a long-term residence.
    clarification: Includes references to being born in DE, growing up in DE, or having
      lived in DE for a long period.
    negative_clarification: Exclude citizenship alone if not tied to residence/birth.
      Use 'citizenship' if only legal status is mentioned.
  citizenship_status:
    definition: Reasoning based solely or primarily on holding German citizenship
      or nationality.
    clarification: Includes mentions of having the German passport, being a German
      citizen, or holding the Staatsbürgerschaft.
    negative_clarification: Exclude if birthplace or residence is also cited as a
      primary reason; use 'birthplace_residence' or 'legal_respect' if those are stronger.
  ancestry_descent:
    definition: Reasoning based on ethnic lineage, family background, or ancestral
      ties to Germany.
    clarification: Includes mentions of German ancestors, Vorfahren, family history,
      or ethnic background.
    negative_clarification: Exclude if the person is a naturalized citizen without
      ethnic ties. Use 'citizenship' or 'legal_respect' instead.
  self_identification:
    definition: Reasoning based on the candidate's self-perception or self-identification
      as German.
    clarification: Includes statements that the person feels German, sees themselves
      as German, or identifies as such.
    negative_clarification: Exclude if the reasoning is about external traits (laws,
      language) rather than internal self-view.
  cultural_heritage:
    definition: Reasoning based on knowledge of German history, traditions, culture,
      or general cultural alignment.
    clarification: Includes references to knowing German history, traditions, culture,
      or fitting into the cultural fabric.
    negative_clarification: Exclude if the reference is specifically to religious
      history (use 'religious_criteria') or legal history (use 'legal_respect').
  general_impression:
    definition: Reasoning based on vague feelings, personal preference, likability,
      or gut instinct without specific substantive criteria.
    clarification: Includes "gut feeling," "sympathetic," "likes me," "best fit,"
      or general positive impressions.
    negative_clarification: Exclude if specific criteria like language, law, or birth
      are mentioned. Use the specific code instead.
  none_of_above:
    definition: Uninformative responses, refusals, noise, or answers that do not fit
      any of the above categories.
    clarification: Includes "no answer," "I don't know," random characters, "both
      are equal," or comments on the survey design itself.
    negative_clarification: Exclude any response that provides a substantive reason
      for the choice, even if weak.

