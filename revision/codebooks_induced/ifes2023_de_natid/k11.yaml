codebook:
  name: ifes2023_de_natid_induced
  residual_code: none_of_above
  context: 'These are open-ended answers from a survey experiment (National-identity
    conjoint with a randomly withheld religion attribute and a task-5 open-end, Germany
    (IFES 2023)). Respondents answered: "Bitte beschreiben Sie, warum die von Ihnen
    gewählte Person eher deutsch ist (Please describe why the person you chose is
    more German)". Read each answer in its original language.'
  induced_by: Qwen/Qwen3.6-35B-A3B-FP8
  induced_from: induce:ifes2023_de_natid:1011
codes:
  religious_criteria:
    definition: Reasoning that explicitly invokes religion, Christianity, the church,
      or religious faith as a primary or significant ground for the person being (more)
      German.
    clarification: Includes mentions of being Christian, having Christian values,
      religious affiliation, or the idea that Germans are predominantly Christian.
    negative_clarification: Excludes general moral values, respect for laws, or cultural
      traditions that are not explicitly tied to religious doctrine. If religion is
      mentioned only as a demographic fact without being used as a criterion for "Germanness,"
      it may still be coded here if it implies a normative link, but pure demographic
      statements without normative weight should be checked against other codes. However,
      in this context, explicit mentions like "christlich" or "weil die deutschen
      hauptsächlich christlich sind" are included.
  legal_institutional_respect:
    definition: Reasoning based on respect for, adherence to, or knowledge of German
      laws, political institutions, and the legal system.
    clarification: Includes explicit mentions of "Respekt vor Gesetzen/Institutionen,"
      "Hält sich an Regeln," or valuing the rule of law as a marker of being German.
    negative_clarification: Excludes general respect for people or abstract values
      not tied to the state's legal framework. If the respondent mentions respect
      but does not specify laws/institutions, check for other codes.
  birthplace_residence:
    definition: Reasoning based on the person's place of birth, length of residence,
      or upbringing in Germany.
    clarification: Includes "in Deutschland geboren," "aufgewachsen," "lebt lange
      in Deutschland," or "Großteil des Lebens in Deutschland verbracht."
    negative_clarification: Excludes citizenship status alone (see citizenship_code)
      or ancestry alone (see ancestry_code). If birth and citizenship are both mentioned,
      prioritize citizenship_code if it is the stated reason, otherwise use birthplace_residence
      if the narrative focuses on life history.
  citizenship_status:
    definition: Reasoning based on the possession or desire for German citizenship
      (Staatsbürgerschaft/Staatsangehörigkeit).
    clarification: Includes explicit mentions of having German citizenship, wanting
      it, or that citizenship is the defining factor.
    negative_clarification: Excludes birthplace or ancestry if citizenship is not
      mentioned. If citizenship is mentioned alongside birth, and citizenship is the
      distinguishing factor, use this code.
  language_proficiency:
    definition: Reasoning based on the ability to speak, understand, or learn the
      German language.
    clarification: Includes "spricht deutsch," "deutsche Sprache mächtig," or language
      acquisition as a key integration marker.
    negative_clarification: Excludes general communication or being understood. If
      language is mentioned alongside other factors, and it is a primary reason, use
      this code.
  ancestry_heritage:
    definition: Reasoning based on biological descent, family background, or ethnic
      heritage.
    clarification: Includes "deutsche Vorfahren," "Herkunft," "ariisch," or bloodline.
    negative_clarification: Excludes cultural assimilation or legal status. If ancestry
      is mentioned with birthplace, and ancestry is the key differentiator, use this
      code.
  cultural_historical_knowledge:
    definition: Reasoning based on familiarity with German history, traditions, customs,
      or cultural norms.
    clarification: Includes "mit Geschichte vertraut," "deutsche Traditionen," "Werte,"
      or cultural integration.
    negative_clarification: Excludes legal respect (see legal_institutional_respect)
      or language (see language_proficiency). If history/tradition is the main point,
      use this code.
  subjective_identification:
    definition: Reasoning based on the person's self-identification, feelings, or
      internal sense of belonging to Germany.
    clarification: Includes "fühlt sich als Deutscher," "empfindet sich als deutsch,"
      "Identifikation," or "Bauchgefühl" (if linked to identity).
    negative_clarification: Excludes objective criteria like birth, law, or language.
      If the respondent says "because they feel German," use this code.
  none_of_above:
    definition: Uninformative, random, non-substantive, or purely procedural responses.
    clarification: Includes "weiß nicht," "keine Ahnung," random characters, "beide
      gleich," "kleineres Übel" (without specific reason), "aus dem Bauch" (without
      elaboration), or responses that do not provide a reason for being "more German."
    negative_clarification: Excludes any substantive reason related to the other codes.
      If a response is ambiguous but leans towards a specific category, code it there.
      If it is truly uninformative, use this code.

