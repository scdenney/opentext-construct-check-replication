codebook:
  name: nk_entrepreneurship_v1
  version: 1
  context: |
    South Korean respondents chose between two government policies supporting businesses run by North Korean migrants, then explained in a few words why they preferred the policy they chose. The answers are English translations of Korean originals.
  residual_code: uninformative
  revised_by: Qwen/Qwen3.6-35B-A3B-FP8
  revision_round: 2
  seed: 3
codes:
  economic_rationale:
    definition: |
      The reason concerns economic, fiscal, or practical policy considerations, including national benefit, efficiency, cost-effectiveness, feasibility, or general improvement of conditions. This includes arguments about what is "good for the country" or "better for Koreans" if framed as a practical or national interest outcome, rather than a moral duty. It also includes references to specific economic mechanisms (e.g., loans, subsidies, employment support) and the economic viability or stability of the policy.
    clarification: |
      Includes references to efficiency, effectiveness, national interest, economic growth, cost, practicality, feasibility, stability, and specific economic tools (loans, subsidies, jobs). "Good for Korea" is economic if it implies national benefit or practical advantage.
    negative_clarification: |
      Does not include arguments based primarily on moral obligation, fairness, human rights, or solidarity. Does not include mere expressions of support without a reason. Does not include reasons based on political alignment or non-economic policy structures unless they imply economic benefit.
  normative_rationale:
    definition: |
      The reason concerns fairness, deservingness, moral obligation, human rights, solidarity, or ethical identity. It focuses on what is morally right or who is owed support based on ethical principles. It also includes reasons based on the emotional or psychological well-being of the beneficiaries (e.g., trust, settlement, harmony) when framed as a moral or humanistic concern rather than a practical economic one.
    clarification: |
      Includes references to human rights, moral duty, solidarity with defectors, fairness, ethical considerations, and emotional/humanistic benefits (e.g., trust, harmony, settling down) when viewed as moral goods.
    negative_clarification: |
      Does not include arguments based on national economic interest, efficiency, or practical feasibility. Does not include mere expressions of support without a moral reason. Does not include reasons based on political alignment or non-economic policy structures.
  other_rationale:
    definition: |
      A substantive reason that is neither economic nor normative. This includes reasons based on political alignment, specific policy mechanisms (e.g., joint ventures, target groups) that are not primarily economic or moral, personal feelings (if not moral), or descriptive facts about the policy structure that do not imply economic or moral value judgments. It also includes reasons based on the form or nature of the support (e.g., "employment support" as a category, not its economic effect) if not explicitly tied to economic gain or moral duty.
    clarification: |
      Includes references to political party support, specific operational details (like joint ventures), target audience descriptions, and non-moral personal preferences or feelings. Reasons based on the policy's form (e.g., "employment support") are "other" unless they explicitly cite economic or moral outcomes.
    negative_clarification: |
      Does not include reasons that are clearly economic (cost/benefit, stability, loans) or normative (moral/fairness, trust as a moral good). Does not include uninformative responses.
  uninformative:
    definition: |
      No substantive reason is given. This includes explicit statements of having no reason, expressions of uncertainty, or mere expressions of support/opinion without an explanatory clause. It also includes responses that are too vague, fragmented, or off-topic to determine a clear rationale.
    clarification: |
      Includes "no reason," "I don't know," "support," "good," "like," "dislike," "none," and off-topic text. Responses that are single words or phrases without a clear link to economic, normative, or other substantive reasons (e.g., "Just," "Recovery," "My heart") are uninformative.
    negative_clarification: Does not include responses that provide a reason, even
      if brief or vague, such as "good for Korea" (economic), "human rights" (normative),
      or "joint venture" (other).

