codebook:
  name: nk_entrepreneurship_v1
  version: 1
  context: |
    South Korean respondents chose between two government policies supporting businesses run by North Korean migrants, then explained in a few words why they preferred the policy they chose. The answers are English translations of Korean originals.
  residual_code: uninformative
  revised_by: Qwen/Qwen3.6-35B-A3B-FP8
  revision_round: 1
  seed: 4
codes:
  economic_rationale:
    definition: |
      The reason explicitly cites economic, fiscal, or practical operational considerations, such as cost-effectiveness, job creation, business growth, financial efficiency, market mechanisms, or specific material benefits. It must refer to the economic mechanics or outcomes of the policy.
    clarification: |
      Includes mentions of subsidies, grants, tax implications, business viability, employment, or financial support structures.
    negative_clarification: |
      Does NOT include vague statements like "good for Korea" or "helpful" unless they are explicitly tied to economic metrics. Does NOT include political endorsements or general moral sentiments.
  normative_rationale:
    definition: |
      The reason cites moral, ethical, identity-based, or political grounds. This includes appeals to fairness, solidarity, national unity, patriotism, human rights, or alignment with specific political groups/ideologies.
    clarification: |
      Includes "good for Korea" (patriotic solidarity), support from human rights groups or political parties (political/identity alignment), and general moral obligations to North Korean defectors.
    negative_clarification: |
      Does NOT include purely economic calculations (e.g., "it saves money"). Does NOT include vague preferences without a stated value basis.
  other_rationale:
    definition: |
      A substantive reason that is neither clearly economic nor normative. This includes vague preferences, political endorsements not tied to specific moral/economic arguments, procedural justifications, or references to external validation (e.g., "president supports it") that do not fit the strict normative or economic definitions.
    clarification: |
      Includes "I like it," "It's better," "Support target" (if not justified by economics/morals), political party support (as a heuristic), and general positive sentiment without specific economic or moral reasoning.
    negative_clarification: |
      Does NOT include empty responses ("no reason", "don't know"). Does NOT include clear economic or normative arguments.
  uninformative:
    definition: |
      No substantive reason is provided. The response is empty, indicates uncertainty ("don't know"), states no preference/reason, or is completely off-topic or nonsensical in the context of the question.
    clarification: |
      Includes "No reason," "I don't know," "None," and text that does not address the preference rationale at all.
    negative_clarification: Does NOT include vague preferences ("I like it") or political/moral
      statements, as these are substantive reasons (classified as other or normative).
      Does NOT include incomplete sentences that imply a reason.

