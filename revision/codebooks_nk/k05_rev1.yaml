codebook:
  name: nk_entrepreneurship_v1
  version: 1
  context: |
    South Korean respondents chose between two government policies supporting businesses run by North Korean migrants, then explained in a few words why they preferred the policy they chose. The answers are English translations of Korean originals.
  residual_code: uninformative
  revised_by: Qwen/Qwen3.6-35B-A3B-FP8
  revision_round: 1
  seed: 5
codes:
  economic_rationale:
    definition: |
      The reason explicitly concerns financial costs, fiscal impacts, operational efficiency, job creation, or practical effectiveness of the policy mechanism. It must refer to tangible economic outcomes or logistical feasibility.
  normative_rationale:
    definition: |
      The reason concerns moral obligations, fairness, deservingness, solidarity, national identity, or the broader benefit to the nation (e.g., "good for Korea"). It includes appeals to what is right, who deserves support, or shared identity/values.
  other_rationale:
    definition: |
      A substantive reason that is neither strictly economic nor normative. Includes expressions of general preference ("I like it"), vague support, observations about policy structure or targets, political context, credibility of supporters, or non-specific justifications that do not fit economic or moral categories.
  uninformative:
    definition: No substantive reason is given. This includes "don't know," "no particular
      reason," "none," "nothing special," or text that is completely off-topic or
      unintelligible. Mere expressions of liking/disliking without any explanatory
      clause are classified as 'other_rationale', not uninformative.

